<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Módulo 4 — Responsable SST</title>
  <link rel="stylesheet" href="wizard.css">
</head>
<body>
  <div class="card">
    <p class="progreso">Módulo 4 de 8 — Responsable SST y consultora</p>
    <h1>Datos precargados — confirma o corrige</h1>
    <form id="form" onsubmit="return confirmar(event)">
      <label>Nombre del responsable SST <input name="nombre_responsable_sst" required></label>
      <label>Cédula del responsable SST <input name="cedula_responsable_sst" required></label>
      <label>Cargo <input name="cargo_sst" required></label>
      <label>Ciudad de expedición de la cédula <input name="ciudad_cedula_sst" required></label>
      <label>Licencia SST <input name="licencia_sst" required></label>
      <label>Empresa consultora <input name="empresa_consultora_sst" required></label>
      <label>NIT de la consultora <input name="nit_consultora_sst" required></label>
      <label>Licencia de la consultora <input name="licencia_empresa_consultora" required></label>
      <label>Firma del responsable SST (imagen)
        <input type="file" id="f_firma_sst" accept="image/*">
      </label>
      <label>Hoja de vida del responsable SST (PDF)
        <input type="file" id="f_hoja_vida_sst" accept="application/pdf">
      </label>
      <label>Licencia SST (PDF)
        <input type="file" id="f_licencia_sst_pdf" accept="application/pdf">
      </label>
      <label>Cédula del responsable SST (PDF)
        <input type="file" id="f_cedula_sst_pdf" accept="application/pdf">
      </label>
      <label>Diploma o certificado de cursos (PDF)
        <input type="file" id="f_diploma_cursos_sst" accept="application/pdf">
      </label>
      <p class="ayuda">Estos 4 documentos se anexan tal cual al SG-SST, como soporte de que el responsable SST cumple los requisitos.</p>
      <button type="submit">Continuar</button>
    </form>
    <p id="error" class="error"></p>
  </div>
  <script src="common.js"></script>
  <script>
    const bid = getBorradorId();

    (async () => {
      try {
        const defaults = await api(`/borradores/${bid}/defaults/modulo-4`);
        rellenarFormulario(document.getElementById("form"), defaults);
      } catch (e) { document.getElementById("error").textContent = e.message; }
    })();

    async function confirmar(ev) {
      ev.preventDefault();
      document.getElementById("error").textContent = "";
      const form = ev.target;

      const archivos = {
        firma_sst: { input: document.getElementById("f_firma_sst"), etiqueta: "la firma del responsable SST" },
        hoja_vida_sst: { input: document.getElementById("f_hoja_vida_sst"), etiqueta: "la hoja de vida" },
        licencia_sst_pdf: { input: document.getElementById("f_licencia_sst_pdf"), etiqueta: "la licencia SST en PDF" },
        cedula_sst_pdf: { input: document.getElementById("f_cedula_sst_pdf"), etiqueta: "la cédula en PDF" },
        diploma_cursos_sst: { input: document.getElementById("f_diploma_cursos_sst"), etiqueta: "el diploma o certificado de cursos" },
      };
      for (const { input, etiqueta } of Object.values(archivos)) {
        if (!input.files[0]) {
          document.getElementById("error").textContent = `Sube ${etiqueta}.`;
          return false;
        }
      }

      const datos = Object.fromEntries(new FormData(form).entries());
      delete datos.firma_sst_archivo;
      const pares = [
        ["Nombre del responsable SST", datos.nombre_responsable_sst],
        ["Cédula del responsable SST", datos.cedula_responsable_sst],
        ["Cargo", datos.cargo_sst],
        ["Ciudad de expedición de la cédula", datos.ciudad_cedula_sst],
        ["Licencia SST", datos.licencia_sst],
        ["Empresa consultora", datos.empresa_consultora_sst],
        ["NIT de la consultora", datos.nit_consultora_sst],
        ["Licencia de la consultora", datos.licencia_empresa_consultora],
        ["Firma", archivos.firma_sst.input.files[0].name],
        ["Hoja de vida", archivos.hoja_vida_sst.input.files[0].name],
        ["Licencia SST (PDF)", archivos.licencia_sst_pdf.input.files[0].name],
        ["Cédula (PDF)", archivos.cedula_sst_pdf.input.files[0].name],
        ["Diploma / certificado de cursos", archivos.diploma_cursos_sst.input.files[0].name],
      ];
      mostrarResumenConfirmacion(resumenFilas(pares), async () => {
        const fd = new FormData();
        for (const [rol, { input }] of Object.entries(archivos)) {
          fd.append(rol, input.files[0]);
        }
        await api(`/borradores/${bid}/modulo-4/archivos`, { method: "POST", body: fd });
        await api(`/borradores/${bid}/modulo-4/confirmar`, { method: "POST", body: datos });
        irAModulo(5, bid);
      });
      return false;
    }
  </script>
</body>
</html>
