# -----------------------------------------------------------------------------
# OPCIÓN A: Subir MANUALES de funciones en una carpeta
# -----------------------------------------------------------------------------
# Formato soportado: .docx (Word), .xlsx (Excel), .pdf (PDF)
# Cada archivo = un cargo. El sistema detecta el nombre automáticamente.
#
# Descomenta la siguiente línea y pon la ruta a la carpeta:
