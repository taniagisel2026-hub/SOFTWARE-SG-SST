# -----------------------------------------------------------------------------
# OPCIÓN B: Definir los cargos directamente en este YAML
# -----------------------------------------------------------------------------
# Estructura de cada cargo:
#
#   - nombre:           (obligatorio) Nombre del cargo
#     proceso:          (opcional)    Nombre del proceso/área al que pertenece
#                                     Ej: "ADMINISTRATIVO", "PRODUCCIÓN",
#                                         "GESTIÓN HUMANA", "LOGÍSTICA",
#                                         "FINANCIERA", "COMERCIAL", etc.
#                                     Cargos del MISMO proceso quedan agrupados.
#                                     Si no lo defines, usa ADMINISTRATIVO u
#                                     OPERATIVO según el tipo del cargo.
#     zona:             (opcional)    Lugar físico de trabajo
#                                     Ej: "Oficinas Administrativas",
#                                         "Planta de Producción",
#                                         "Bodega Principal"
#     tipo:             (opcional)    administrativo | operativo |
#                                     conductor | servicios_generales
#                                     Si no lo defines, se infiere del nombre.
#     num_expuestos:    (opcional)    Cuántas personas tienen este cargo (default 1)
#     actividades:      (opcional)    Descripción del cargo (1-3 líneas).
#                                     Si vacío y hay manual, usa el del manual.
#                                     Si vacío y sin manual, genera texto genérico.
#     tareas:           (opcional)    Bullets de tareas reales del cargo.
#                                     Usa "|" para texto en varias líneas.
#     rutinaria:        (opcional)    "SI" o "NO" (default "SI")
#
# EJEMPLO REAL (descomenta y adapta a tu cliente):

