descripcion_empresa: >
 Empresa dedicada al alquiler y arrendamiento de maquinaria, equipos y bienes tangibles para el sector de la construcción, combinando esta capacidad logística con la ejecución y desarrollo de obras de ingeniería civil. Su modelo de negocio le permite proveer soporte operativo con equipo especializado, así como ejecutar directamente proyectos de infraestructura vial, urbanismo, redes de servicios públicos y obras civiles complementarias.
