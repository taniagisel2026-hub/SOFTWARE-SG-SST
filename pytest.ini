[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
markers =
    slow: marca tests que tardan más de 5 segundos
    integration: requiere recursos externos (Drive, Claude API)
filterwarnings =
    ignore::UserWarning:openpyxl
    ignore::DeprecationWarning
